name: SENTINEL checks
on:
  push:
    branches: [main, migration/parrish-lyon-watermarks]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    name: integrity-and-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Confirm source import exists
        run: test -f sentinel_guard.py && test -f frontend/index.html
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Scan tracked files for credentials and private data files
        run: python sentinel_guard.py secrets
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python -m compileall -q backend app.py sentinel_guard.py tests
      - name: Check JavaScript syntax
        run: find frontend/js -name '*.js' -print0 | while IFS= read -r -d '' f; do node --input-type=module --check < "$f" || exit 1; done
      - name: Print initial baseline candidate for review
        if: always()
        run: |
          if [ -f sentinel_guard.py ] && [ ! -f integrity.sha256.json ]; then
            echo 'BEGIN_SENTINEL_BASELINE_CANDIDATE'
            python sentinel_guard.py candidate
            echo 'END_SENTINEL_BASELINE_CANDIDATE'
          fi
      - name: Verify committed integrity baseline
        run: python sentinel_guard.py check
